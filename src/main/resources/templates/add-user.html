<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add User - Drift</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="centered">
    <div class="container-centered">
        <header class="centered">
            <h1>➕ Add New User</h1>
            <p class="subtitle">Fill in the form below</p>
        </header>
        
        <form method="post" action="/add-user" onsubmit="return validateUserForm(event)">
            <div class="form-group">
                <label for="name">Full Name *</label>
                <input type="text" id="name" name="name" required placeholder="Enter full name">
            </div>
            
            <div class="form-group">
                <label for="email">Email Address *</label>
                <input type="email" id="email" name="email" required placeholder="Enter email">
            </div>
            
            <div class="form-group">
                <label for="phone">Phone Number *</label>
                <input type="tel" id="phone" name="phone" required placeholder="Enter phone number">
            </div>
            
            <div class="form-actions">
                <a href="/" class="btn btn-full btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-full btn-primary">Create User</button>
            </div>
        </form>
    </div>
    
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
