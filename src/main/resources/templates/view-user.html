<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View User - Drift</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="centered">
    <div class="container-centered">
        <header class="centered">
            <h1>👤 User Details</h1>
        </header>
        
        <div class="user-card">
            <div class="user-field">
                <div class="field-label">User ID</div>
                <div class="field-value" th:text="${user.id}"></div>
            </div>
            
            <div class="user-field">
                <div class="field-label">Full Name</div>
                <div class="field-value" th:text="${user.name}"></div>
            </div>
            
            <div class="user-field">
                <div class="field-label">Email Address</div>
                <div class="field-value" th:text="${user.email}"></div>
            </div>
            
            <div class="user-field">
                <div class="field-label">Phone Number</div>
                <div class="field-value" th:text="${user.phone}"></div>
            </div>
        </div>
        
        <div class="form-actions">
            <a href="/" class="btn btn-full btn-secondary">Back</a>
            <a th:href="@{/edit-user/{id}(id=${user.id})}" class="btn btn-full btn-primary">Edit</a>
            <form method="post" th:action="@{/delete-user/{id}(id=${user.id})}" style="flex: 1;" onsubmit="return confirm('Are you sure you want to delete this user? This action cannot be undone.');">
                <button type="submit" class="btn btn-full btn-danger">Delete</button>
            </form>
        </div>
    </div>
    
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
